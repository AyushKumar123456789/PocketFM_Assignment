[project]
name = "goagent"
version = "0.1.0"
description = "An agentic AI contributor for open-source Go projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayush Jain", email = "ayushjitendra28@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    # Either provider works; both are listed so users can pick at runtime.
    # Free Gemini key: https://aistudio.google.com/apikey
    "anthropic>=0.40.0",
    "google-genai>=0.7.0",
    "openai>=1.50.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
goagent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
